name: Calycopis broker packages

on:
  push:
    branches:
      - 'main'

  pull_request:

  workflow_dispatch:

jobs:

  build-java-broker:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      TEST_ENV: test-env

    steps:

      - name: Check what environment variables we can see
        run: |
            echo "TEST_ENV [${TEST_ENV}]"
            echo "TEST_VAR [${TEST_VAR}]"
            echo "TEST_SECRET [${TEST_SECRET}]"
        env:
          TEST_ENV: ${{env.TEST_ENV}}
          TEST_VAR: ${{vars.TEST_VAR}}
          TEST_SECRET: ${{secrets.TEST_SECRET}}

      # https://github.com/actions/checkout
      - name: Checkout our GitHub project
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Initialise the build versions
        shell: bash
        run: |
            bin/versions.sh

      - name: Check the build versions
        run: |
            echo "CALYCOPIS_BROKER_VERSION [${{env.CALYCOPIS_BROKER_VERSION}}]"
            echo "CALYCOPIS_OPENAPI_SCHEMA_VERSION [${{env.CALYCOPIS_OPENAPI_SCHEMA_VERSION}}]"
            echo "CALYCOPIS_OPENAPI_SPRING_VERSION [${{env.CALYCOPIS_OPENAPI_SPRING_VERSION}}]"
            echo "CALYCOPIS_OPENAPI_PYTHON_VERSION [${{env.CALYCOPIS_OPENAPI_PYTHON_VERSION}}]"

      - name: Install Podman with socket service
        uses: redhat-actions/podman-install@v1
        with:
          start-service: 'true'

      - name: Initialise the CONTAINER_HOST socket
        shell: bash
        run: |
            bin/container-host.sh

      - name: Check the CONTAINER_HOST socket
        run: |
            echo "CONTAINER_PATH [${{env.CONTAINER_PATH}}]"
            echo "CONTAINER_HOST [${{env.CONTAINER_HOST}}]"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install our Maven settings
        run: |
            mkdir -p ~/.m2
            cp -f java/settings.xml \
                  ~/.m2/settings.xml

      - name: Check our Maven settings
        run: |
            cat ~/.m2/settings.xml

      # https://github.com/actions/cache/blob/main/examples.md#java---maven
      - name: Cache our Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build the Java JAR file
        working-directory: java
        run: |
          ./mvnw \
            --batch-mode \
            clean install

      - name: Package the broker in an OCI container
        id: build-image
        working-directory: java
        run: |
          ./mvnw \
            --batch-mode \
            spring-boot:build-image

      - name: Build the integration test container
        run: |
          podman build \
            --build-arg "buildtime=$(date '+%Y-%m-%dT%H:%M:%S')" \
            --build-arg "CALYCOPIS_BROKER_VERSION=${{env.CALYCOPIS_BROKER_VERSION}}" \
            --build-arg "CALYCOPIS_OPENAPI_SPRING_VERSION=${{env.CALYCOPIS_OPENAPI_SPRING_VERSION}}" \
            --build-arg "CALYCOPIS_OPENAPI_PYTHON_VERSION=${{env.CALYCOPIS_OPENAPI_PYTHON_VERSION}}" \
            --tag "calycopis/python-tester:latest" \
            --tag "calycopis/python-tester:${{env.CALYCOPIS_BROKER_VERSION}}" \
            tests/python

      - name: Check the images in our Podman cache
        run: |
          podman images

      - name: Check the images in our Docker cache
        run: |
          docker images

      - name: Install password generator
        run: |
          sudo apt-get update
          sudo apt-get install --yes pwgen

      - name: Run our integration tests
        working-directory: tests/python
        shell: bash
        run: |
          bin/run-tests.sh
        env:
          CONTAINER_PATH: ${{env.CONTAINER_PATH}}
          CONTAINER_HOST: ${{env.CONTAINER_HOST}}
          CALYCOPIS_BROKER_VERSION: ${{env.CALYCOPIS_BROKER_VERSION}}
          CALYCOPIS_OPENAPI_SCHEMA_VERSION: ${{env.CALYCOPIS_OPENAPI_SCHEMA_VERSION}}
          CALYCOPIS_OPENAPI_SPRING_VERSION: ${{env.CALYCOPIS_OPENAPI_SPRING_VERSION}}
          CALYCOPIS_OPENAPI_PYTHON_VERSION: ${{env.CALYCOPIS_OPENAPI_PYTHON_VERSION}}

      - name: Upload the JAR as a GitHub artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'calycopis-broker-'
          path: 'java/target/calycopis-broker-${{env.CALYCOPIS_BROKER_VERSION}}.jar'

      - name: Publish the JAR to the UKSRC Nexus repository.
        if: >
            github.repository == 'uksrc/Calycopis-broker' &&
            github.event_name == 'push' &&
            github.ref_name == 'main'
        working-directory: java
        run: |
          ./mvnw \
            --batch-mode \
            deploy \
              -Puksrc-profile
        env:
          UKSRC_REPO_USERNAME: ${{ secrets.UKSRC_REPO_USERNAME }}
          UKSRC_REPO_PASSWORD: ${{ secrets.UKSRC_REPO_PASSWORD }}

      - name: Publish the JAR to the IVOA GitHub repository.
        if: >
            github.repository == 'ivoa/Calycopis-broker' &&
            github.event_name == 'push' &&
            github.ref_name == 'main'
        working-directory: java
        run: |
          ./mvnw \
            --batch-mode \
            deploy \
              -Pivoa-profile
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Push the image to the UKSRC Harbor registry
        uses: redhat-actions/push-to-registry@v3
        id: push-uksrc-harbor
        if: >
            github.repository == 'uksrc/Calycopis-broker' &&
            github.event_name == 'push' &&
            github.ref_name == 'main'
        with:
          image: 'calycopis/calycopis-broker'
          tags: ${{ env.CALYCOPIS_BROKER_VERSION }}
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

