#
# The compute pools this deployment declares.
#
# Each pool needs a unique name. The name is what the startup seed uses to
# decide whether a pool already exists, so renaming a pool creates a second one.
#
# An empty or missing compute list gives the broker a single pool called
# "default". Listing pools here replaces that fallback: the deployment gets the
# pools it names and no default, because a list is a list.
#
# Capacity is not part of a pool yet. Allocations arrive in stage 3 of the
# compute pools plan, and until then the broker keeps reading its capacity from
# the calycopis.broker.booking.capacity section of spring.yaml.
#
calycopis:
    broker:
        pools:
            compute:
              -
                name: default
                description: The default compute pool.
