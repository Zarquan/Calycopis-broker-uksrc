#
# The compute pools this deployment declares.
#
# Each pool needs a unique name. The name is what the startup seed uses to
# decide whether a pool already exists, so renaming a pool creates a second one.
#
# The broker always seeds a pool called "default", whether or not this list
# names one, because the request path currently needs a pool it can rely on.
#
# Capacity comes from allocations. Each pool may declare a list of allocations,
# each with cores, memory in GiB, and an optional start and end. An allocation
# with no end is open ended; one with no start has always been available. A pool
# that declares no allocations gets one open ended allocation from the
# calycopis.broker.booking.capacity section of spring.yaml, so a deployment
# without allocations keeps the capacity it had before pools had capacity.
#
calycopis:
    broker:
        pools:
            compute:
              -
                name: default
                description: The default compute pool.
                #
                # Uncomment to size this pool explicitly instead of using the
                # configured capacity.
                #
#                allocations:
#                  -
#                    cores: 256
#                    memory: 256
