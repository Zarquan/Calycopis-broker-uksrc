#
# Prometheus configuration template.
#
# config-monitoring.sh replaces __BROKER_TARGET__ with the broker hostname and
# internal port before Prometheus starts. The scrape interval matches the
# broker's compute pool refresh interval, so each scrape can see a new value.
#

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: calycopis-broker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "__BROKER_TARGET__"
