#
# Grafana Prometheus datasource template.
#
# config-monitoring.sh replaces __PROMETHEUS_URL__ with the Prometheus service
# URL inside the pod. The fixed uid is what the provisioned dashboard refers
# to, so the dashboard does not depend on Grafana's generated datasource id.
#

apiVersion: 1

datasources:
  - name: Calycopis Prometheus
    uid: calycopis-prometheus
    type: prometheus
    access: proxy
    url: "__PROMETHEUS_URL__"
    isDefault: true
    editable: false
    jsonData:
      httpMethod: GET
      timeInterval: 15s
