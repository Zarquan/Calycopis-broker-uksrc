#
# Grafana dashboard provider.
#
# The dashboard JSON is copied into the same monitoring config volume by
# config-monitoring.sh. Grafana reloads it every 30 seconds, which is enough
# for a provisioning change to be picked up without a restart.
#

apiVersion: 1

providers:
  - name: Calycopis
    orgId: 1
    folder: Calycopis
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: "__DASHBOARD_PATH__"
      foldersFromFilesStructure: false
